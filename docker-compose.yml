# The databases for the course. Start: docker compose up -d · Stop: docker compose down
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"   # REST API + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: larkspan
      POSTGRES_PASSWORD: larkspan
      POSTGRES_DB: larkspan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql   # Postgres 18+ stores data here (not .../data)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larkspan -d larkspan"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  qdrant_data:
  postgres_data:
